name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # v5+ caches automatically; npm advises against caching in release builds.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. Pinned to
      # the 11.x line because npm@latest (12.x) requires a newer Node than 22.
      - run: npm install -g npm@^11.5.1

      - run: npm ci --ignore-scripts

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Sync versions with tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '$VERSION';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Build MCPB bundle
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack . jw-mcp.mcpb

      # Authenticates via OIDC (id-token: write) — no NPM_TOKEN secret needed.
      # Requires a trusted publisher configured for this package on npmjs.com
      # pointing at this repo and this workflow filename.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: jw-mcp.mcpb
          body: |
            ## Installation

            ### Claude Desktop (one-click)
            Download `jw-mcp.mcpb` below and open it — Claude Desktop will install the extension automatically.

            ### Claude Code
            ```bash
            claude mcp add jw-mcp -- npx -y jw-mcp
            ```

            ### Docker (self-hosted)
            ```bash
            docker pull ghcr.io/advenimus/jw-mcp:v${{ steps.version.outputs.version }}
            ```
            See [Docker setup](https://github.com/advenimus/jw-mcp#docker-self-hosted) in the README.

            ### Manual Config
            Add to your Claude Desktop config:
            ```json
            {
              "mcpServers": {
                "jw-mcp": {
                  "command": "npx",
                  "args": ["-y", "jw-mcp"]
                }
              }
            }
            ```

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required to build the linux/arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ needs.release.outputs.version }}
