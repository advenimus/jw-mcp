services:
  jw-mcp:
    build: .
    image: ghcr.io/advenimus/jw-mcp:local
    container_name: jw-mcp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      - MCP_BASE_URL=${MCP_BASE_URL}
      - MCP_AUTH_SECRET=${MCP_AUTH_SECRET}
      - MCP_AUTH=${MCP_AUTH:-true}
      - MCP_TRUST_PROXY=${MCP_TRUST_PROXY:-}
      - AUTH_STORE_PATH=/data/auth.json
    volumes:
      - jw-mcp-auth:/data

  # Optional: docker compose --profile tunnel up -d
  # Outbound-only link to Cloudflare, so no router port has to be opened.
  # Point the tunnel's public hostname at the jw-mcp service on port 8080 (see README).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: jw-mcp-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      jw-mcp:
        condition: service_healthy

volumes:
  jw-mcp-auth:
