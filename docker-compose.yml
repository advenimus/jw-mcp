services:
  jw-mcp:
    build: .
    image: ghcr.io/advenimus/jw-mcp:local
    container_name: jw-mcp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      - MCP_BASE_URL=${MCP_BASE_URL}
      - MCP_AUTH_SECRET=${MCP_AUTH_SECRET}
      - MCP_AUTH=${MCP_AUTH:-true}
      - MCP_TRUST_PROXY=${MCP_TRUST_PROXY:-}
      - AUTH_STORE_PATH=/data/auth.json
    volumes:
      - jw-mcp-auth:/data

volumes:
  jw-mcp-auth:
